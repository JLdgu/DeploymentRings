name: Dotnet CI Composite
description: Run common .NET CI steps (checkout, setup, restore, build, and test).
inputs:
  dotnet-version:
    description: .NET SDK version to install
    required: false
    default: 10.0.x
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore

    - name: Build
      shell: pwsh
      run: dotnet build --no-restore

    - name: Test
      shell: pwsh
      run: dotnet test --no-build --verbosity normal
