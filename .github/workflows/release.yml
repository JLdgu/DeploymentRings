name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix."
          }
          "value=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish application
        shell: pwsh
        run: ./publish.ps1

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Download previous release
        run: >-
          vpk download github
          --repoUrl "https://github.com/${{ github.repository }}"
          --token "$env:GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack release
        shell: pwsh
        env:
          CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERTIFICATE_BASE64)) {
            throw "The CODE_SIGNING_CERTIFICATE_BASE64 Actions secret is required to sign releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The CODE_SIGNING_CERTIFICATE_PASSWORD Actions secret is required to sign releases."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "deployment-rings-code-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERTIFICATE_BASE64)
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            $signParams = "/fd sha256 /f `"$certificatePath`" /p `"$env:CODE_SIGNING_CERTIFICATE_PASSWORD`" /t http://time.certum.pl/"

            vpk pack `
              --packId DeploymentRings `
              --packTitle "Deployment Rings" `
              --packVersion $env:RELEASE_VERSION `
              --packDir publish `
              --mainExe DeploymentRings.exe `
              --outputDir Releases `
              --signParams $signParams

            if ($LASTEXITCODE -ne 0) {
              throw "Velopack packaging or code signing failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }

      - name: Publish GitHub release
        run: >-
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --publish
          --releaseName "Deployment Rings ${{ steps.version.outputs.value }}"
          --tag "${{ github.ref_name }}"
          --token "$env:GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
